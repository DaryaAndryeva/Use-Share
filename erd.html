<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Схема БД — Use & Share</title>
<meta name="description" content="ER-диаграмма базы данных Use & Share: 7 таблиц и связи между ними">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #14243f; --ink-2: #4a5a72; --ink-3: #7a879a;
  --rule: #dfe5ee; --rule-2: #eef2f7;
  --navy: #1e3a66; --green: #1f8a70; --sand: #b98234; --red: #b4423a;
  --g-people: #1e3a66; --g-catalog: #1f8a70; --g-deal: #b98234; --g-money: #2f7d9a; --g-control: #6b5b95;
  --line: #9aa7b8; --line-user: #8fa3c4;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans: 'Montserrat', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1724; --card: #172235; --ink: #e8edf5; --ink-2: #b2bdcd; --ink-3: #8592a6;
    --rule: #2a3850; --rule-2: #1f2b40;
    --g-people: #7aa2e3; --g-catalog: #3fbf9b; --g-deal: #e0a85a; --g-money: #63b6d4; --g-control: #a996d6;
    --line: #5d6b82; --line-user: #6f86ad; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1724; --card: #172235; --ink: #e8edf5; --ink-2: #b2bdcd; --ink-3: #8592a6;
  --rule: #2a3850; --rule-2: #1f2b40;
  --g-people: #7aa2e3; --g-catalog: #3fbf9b; --g-deal: #e0a85a; --g-money: #63b6d4; --g-control: #a996d6;
  --line: #5d6b82; --line-user: #6f86ad; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/1.45 var(--sans); }
a { color: var(--g-catalog); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 32px 32px 64px; }
header.top { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
.top h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; }
.top .back { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; text-decoration: none; margin-bottom: 10px; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; font: 600 13px var(--sans); color: var(--ink-2); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #2d4f86; }
.btn { border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: 600 13px var(--sans); padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 12px 16px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 16px; font-size: 13px; color: var(--ink-2); }
.legend b { color: var(--ink); font-weight: 700; }
.legend .item { display: inline-flex; gap: 8px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.key { font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 4px; letter-spacing: .02em; }
.key.pk { background: #f6e7c8; color: #7a5212; }
.key.fk { background: #dbe7f7; color: #1e3a66; }
.key.uk { background: #e3f1ec; color: #17664f; }
:root[data-theme="dark"] .key.pk { background: #4a3a1c; color: #f2cf8f; }
:root[data-theme="dark"] .key.fk { background: #233b61; color: #b9d0f3; }
:root[data-theme="dark"] .key.uk { background: #1d4237; color: #9fe0c9; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .key.pk { background: #4a3a1c; color: #f2cf8f; }
  :root:not([data-theme="light"]) .key.fk { background: #233b61; color: #b9d0f3; }
  :root:not([data-theme="light"]) .key.uk { background: #1d4237; color: #9fe0c9; }
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #2d4f86; }
}

.board { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 16px; overflow-x: auto; }
.canvas { position: relative; width: 1776px; margin: 0 auto; transform-origin: 0 0; }
.board.fit { overflow: hidden; }
.board.fit .canvas { margin: 0; }
.zoom { display: none; }
.board.can-fit + .zoombar .zoom { display: inline-flex; }
.zoombar { display: flex; justify-content: flex-end; margin: 8px 0 0; }
svg.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.t { position: absolute; width: 320px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 1px 2px rgba(20,36,63,.06), 0 6px 18px rgba(20,36,63,.06); transition: opacity .15s, box-shadow .15s; }
.t::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 5px; border-radius: 12px 12px 0 0; background: var(--g); }
.t-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--rule); }
.t-title h2 { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 800; }
.t-sub { display: flex; gap: 8px; align-items: baseline; margin-top: 2px; }
.t-sub code { font: 500 12px var(--mono); color: var(--ink-3); }
.t-sub .fr { margin-left: auto; font: 600 10.5px var(--mono); color: var(--g); white-space: nowrap; }
.t-desc { margin: 3px 0 0; font-size: 12px; line-height: 1.4; color: var(--ink-2); }
.rows { list-style: none; margin: 0; padding: 4px 0 6px; }
.r { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 6px; height: 24px; padding: 0 12px 0 10px; font-size: 12px; }
.r:nth-child(even) { background: var(--rule-2); }
.r .name { font: 500 12px var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r .name i { font-style: normal; font-family: var(--sans); font-weight: 500; color: var(--ink-3); margin-left: 6px; font-size: 11.5px; }
.r .type { font: 400 11px var(--mono); color: var(--ink-3); white-space: nowrap; }
.r.key-row .name { font-weight: 600; }
.t-main { border-color: var(--g-people); box-shadow: 0 0 0 1px var(--g-people), 0 10px 28px rgba(20,36,63,.12); }
.t-main .t-title h2 { font-size: 18px; }
.board.focus .r.on { background: color-mix(in srgb, var(--g-catalog) 18%, transparent); }
.lbl { font-size: 11.5px; }
.r .ref { font: 600 10.5px var(--mono); color: var(--line-user); }
.hidden-rows { display: none; }
body.keys-only .r.plain { display: none; }
body.keys-only .hidden-rows { display: block; padding: 2px 12px 8px 46px; font-size: 11.5px; color: var(--ink-3); }
.board.focus .t { opacity: .35; }
.board.focus .t.on { opacity: 1; box-shadow: 0 0 0 2px var(--g), 0 8px 24px rgba(20,36,63,.12); }
.lnk { fill: none; stroke: var(--line); stroke-width: 1.6; transition: opacity .15s, stroke .15s; }
.lnk.user { stroke: var(--line-user); stroke-dasharray: 5 4; }
.board.focus .lnk { opacity: .12; }
.board.focus .lnk.on { opacity: 1; stroke: var(--ink); stroke-width: 2; stroke-dasharray: none; }
.lbl { font: 600 10.5px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; transition: opacity .15s; }
.board.focus .lbl { opacity: .15; }
.board.focus .lbl.on { opacity: 1; fill: var(--ink); }
.mk { fill: none; stroke: var(--line); stroke-width: 1.6; }

@media (max-width: 600px) { .wrap { padding: 20px 16px 48px; } .top h1 { font-size: 24px; } .controls { margin-left: 0; flex-wrap: wrap; } }
@media print { .controls { display: none; } body { background: #fff; } .board { border-color: #ccc; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <a class="back" href="/">← Use &amp; Share</a>
      <h1>Схема базы данных</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Какие поля показывать">
        <button type="button" data-mode="all" aria-pressed="true">Все поля</button>
        <button type="button" data-mode="keys" aria-pressed="false">Только ключи</button>
      </div>
      <button type="button" class="btn" id="theme" aria-label="Сменить тему">Тёмная тема</button>
    </div>
  </header>

  <div class="legend" aria-label="Легенда">
    <span class="item"><span class="dot" style="background:var(--g-people)"></span><b>Люди</b></span>
    <span class="item"><span class="dot" style="background:var(--g-catalog)"></span><b>Каталог</b></span>
    <span class="item"><span class="dot" style="background:var(--g-deal)"></span><b>Договорённость</b></span>
    <span class="item"><span class="dot" style="background:var(--g-money)"></span><b>Деньги</b></span>
    <span class="item"><span class="key pk">PK</span> первичный ключ</span>
    <span class="item"><span class="key fk">FK</span> ссылка на другую таблицу</span>
    <span class="item"><span class="key uk">UK</span> уникальное значение (или пара)</span>
    <span class="item"><svg width="64" height="14" aria-hidden="true"><path d="M2 7H62" stroke="var(--line)" stroke-width="1.6"/><path d="M2 1L10 7L2 13M10 1V13" class="mk"/><path d="M56 1V13M60 1V13" class="mk"/></svg>много → один</span>
    <span class="item"><svg width="44" height="14" aria-hidden="true"><path d="M2 7H42" stroke="var(--line-user)" stroke-width="1.6" stroke-dasharray="5 4"/></svg>ссылка на пользователя</span>
  </div>

  <div class="board" id="board">
    <div class="canvas" id="canvas">
      <svg class="links" id="links" aria-hidden="true"></svg>
    </div>
  </div>
  <div class="zoombar"><div class="seg zoom" role="group" aria-label="Масштаб схемы">
    <button type="button" data-zoom="fit" aria-pressed="true">Вписать в экран</button>
    <button type="button" data-zoom="full" aria-pressed="false">Крупно</button>
  </div></div>

</div>

<script>
const T = {
  users: {g: '--g-people', main: true, ru: 'Пользователи', fr: 'FR-01 · FR-10', desc: 'Вход через Telegram. Один аккаунт — и арендатор, и владелец.', cols: [
    ['id', 'PK', 'bigserial'], ['telegram_id', 'UK', 'bigint', 'вход'], ['telegram_username', '', 'text', 'виден после брони'], ['name', '', 'text'],
    ['photo_url', '', 'text'], ['role', '', 'text', 'user / moderator'], ['is_blocked', '', 'boolean'], ['pdn_consent_at', '', 'timestamptz', 'согласие на ПДн'], ['created_at', '', 'timestamptz']]},
  search_requests: {g: '--g-catalog', ru: 'Запросы «ищу»', fr: 'FR-03', desc: 'Вещи нет в каталоге — владельцам рядом приходит уведомление.', cols: [
    ['id', 'PK', 'bigserial'], ['author_id', 'FK', 'bigint', 'кто ищет'], ['category', '', 'category'], ['description', '', 'text'],
    ['starts_at · ends_at', '', 'timestamptz', 'когда нужна'], ['max_price', '', 'numeric', 'бюджет'], ['location', '', 'point'], ['created_at', '', 'timestamptz'], ['closed_at', '', 'timestamptz', 'запрос закрыт']]},
  listings: {g: '--g-catalog', ru: 'Объявления', fr: 'FR-02 · 04 · 09', desc: 'Вещь, которую сдают: цена, залог, где находится.', cols: [
    ['id', 'PK', 'bigserial'], ['owner_id', 'FK', 'bigint', 'владелец'], ['category', '', 'category'], ['title', '', 'text'], ['description', '', 'text'],
    ['photos', '', 'text[]', '1–10 фото'], ['price_per_hour', '', 'numeric'], ['price_per_day', '', 'numeric'], ['deposit', '', 'numeric', 'залог'],
    ['district · location', '', 'text · point', 'где'], ['status', '', 'listing_status'], ['promoted_until', '', 'timestamptz', 'продвижение'], ['created_at', '', 'timestamptz']]},
  chats: {g: '--g-deal', ru: 'Чаты', fr: 'FR-03 · FR-05', desc: 'Один чат на пару «вещь + арендатор» — пара уникальна. Владелец берётся из объявления.', cols: [
    ['id', 'PK', 'bigserial'], ['listing_id', 'FK UK', 'bigint', 'о какой вещи'], ['renter_id', 'FK UK', 'bigint', 'арендатор'],
    ['search_request_id', 'FK', 'bigint', 'отклик на «ищу»'], ['created_at', '', 'timestamptz']]},
  bookings: {g: '--g-deal', ru: 'Брони', fr: 'FR-06 · FR-07', desc: 'Бронь от запроса до возврата вещи.', cols: [
    ['id', 'PK', 'bigserial'], ['renter_id', 'FK', 'bigint', 'арендатор'], ['listing_id', 'FK', 'bigint', 'что берут'], ['starts_at · ends_at', '', 'timestamptz', 'период'],
    ['status', '', 'booking_status'], ['rent_amount', '', 'numeric', 'аренда'], ['commission_amount', '', 'numeric', '10 %'], ['deposit_amount', '', 'numeric', 'залог'],
    ['handover_photos', '', 'text[]', 'фото передачи'], ['return_photos', '', 'text[]', 'фото возврата'], ['created_at · completed_at', '', 'timestamptz']]},
  messages: {g: '--g-deal', ru: 'Сообщения', fr: 'FR-05', desc: 'Пишет одна из двух сторон чата, читает другая — отметка о прочтении одна.', cols: [
    ['id', 'PK', 'bigserial'], ['chat_id', 'FK', 'bigint', 'в каком чате'], ['sender', '', 'party', 'renter / owner'], ['body', '', 'text', 'до 2000 знаков'],
    ['client_msg_id', 'UK', 'uuid', 'защита от дублей'], ['created_at', '', 'timestamptz'], ['read_at', '', 'timestamptz', 'прочитано']]},
  payments: {g: '--g-money', ru: 'Платежи', fr: 'FR-07 · NFR-02', desc: 'Оплата, залог и выплата владельцу — отдельными операциями.', cols: [
    ['id', 'PK', 'bigserial'], ['booking_id', 'FK', 'bigint', 'за какую бронь'], ['kind', '', 'payment_kind', 'что за операция'], ['amount', '', 'numeric'],
    ['status', '', 'payment_status'], ['provider_payment_id', 'UK', 'text', 'у провайдера'], ['idempotency_key', 'UK', 'uuid', 'без двойной оплаты'], ['created_at', '', 'timestamptz']]},
};
// Колонки слева направо — по ходу сделки
const COLS = [['users', 'search_requests'], ['listings'], ['chats', 'bookings'], ['messages', 'payments']];
const COL_X = [96, 536, 976, 1416], TOP = 72, GAP = 56;
// Связи: от поля-ссылки к id. Подпись — роль.
const L = [
  {from: ['listings', 'owner_id'], to: 'users', label: 'владелец'},
  {from: ['search_requests', 'author_id'], to: 'users', label: 'кто ищет'},
  {from: ['chats', 'renter_id'], to: 'users', label: 'арендатор'},
  {from: ['bookings', 'renter_id'], to: 'users', label: 'арендатор'},
  {from: ['chats', 'listing_id'], to: 'listings', label: 'о какой вещи'},
  {from: ['chats', 'search_request_id'], to: 'search_requests', label: 'отклик на запрос'},
  {from: ['bookings', 'listing_id'], to: 'listings', label: 'что берут'},
  {from: ['messages', 'chat_id'], to: 'chats', label: 'в каком чате'},
  {from: ['payments', 'booking_id'], to: 'bookings', label: 'за какую бронь'},
];

const canvas = document.getElementById('canvas');
const svg = document.getElementById('links');
const board = document.getElementById('board');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const els = {};
for (const [name, t] of Object.entries(T)) {
  const el = document.createElement('article');
  el.className = 't' + (t.main ? ' t-main' : '');
  el.style.cssText = `--g:var(${t.g})`;
  el.dataset.t = name;
  const plain = t.cols.filter((c) => !c[1]).map((c) => c[0]);
  el.innerHTML = `<div class="t-head"><div class="t-title"><h2>${esc(t.ru)}</h2><div class="t-sub"><code>${name}</code><span class="fr">${esc(t.fr)}</span></div></div><p class="t-desc">${esc(t.desc)}</p></div>
    <ul class="rows">${t.cols.map(([c, k, type, note, ref]) => `<li class="r ${k ? 'key-row' : 'plain'}" data-c="${esc(c)}">${k ? `<span class="key ${k.split(' ')[0].toLowerCase()}">${k.replace(' ', '·')}</span>` : '<span></span>'}<span class="name">${esc(c)}${note ? `<i>${esc(note)}</i>` : ''}</span>${ref ? `<span class="ref">→ ${ref}</span>` : `<span class="type">${esc(type)}</span>`}</li>`).join('')}</ul>
    <div class="hidden-rows">ещё ${plain.length}: ${esc(plain.join(', '))}</div>`;
  canvas.appendChild(el);
  els[name] = el;
}

function rowY(t, c) {
  const row = els[t].querySelector(`[data-c="${CSS.escape(c)}"]`);
  return els[t].offsetTop + row.offsetTop + row.offsetHeight / 2;
}
const L_ = (t) => els[t].offsetLeft, R_ = (t) => els[t].offsetLeft + els[t].offsetWidth;
function draw() {
  let h = 0;
  for (const el of Object.values(els)) h = Math.max(h, el.offsetTop + el.offsetHeight);
  canvas.style.height = h + 40 + 'px';
  svg.setAttribute('width', canvas.offsetWidth);
  svg.setAttribute('height', h + 40);
  let out = `<defs>
    <marker id="many" viewBox="0 0 16 16" refX="1" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M15 1L1 8L15 15M1 8H15" class="mk"/></marker>
    <marker id="one" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M6 1V15M10 1V15" class="mk"/></marker></defs>`;
  for (const l of L) {
    const [ft, fc] = l.from, tt = l.to;
    // составной ключ: линия идёт от середины между его строками
    const avg = (t, cs) => cs.reduce((a, c) => a + rowY(t, c), 0) / cs.length;
    const y1 = avg(ft, [].concat(fc)), y2 = avg(tt, l.toCols ?? ['id']);
    let d, lx, ly, anchor;
    if (L_(ft) === L_(tt)) {
      // таблицы в одной колонке: дуга слева (первая колонка) или справа
      const left = L_(ft) < 300;
      const x = left ? L_(ft) : R_(ft), bend = left ? -Math.min(84, 36 + Math.abs(y1 - y2) / 6) : Math.min(84, 36 + Math.abs(y1 - y2) / 6);
      d = `M${x} ${y1} C${x + bend} ${y1} ${x + bend} ${y2} ${x} ${y2}`;
      lx = x + (left ? -14 : 14); ly = y1 + 16; anchor = left ? 'end' : 'start';
    } else {
      // от поля-ссылки (слева у дочерней таблицы) к строке id (справа у главной)
      const x1 = L_(ft), x2 = R_(tt), k = Math.max(60, (x1 - x2) * 0.5);
      d = `M${x1} ${y1} C${x1 - k} ${y1} ${x2 + k} ${y2} ${x2} ${y2}`;
      lx = x1 - 16; ly = y1 - 6; anchor = 'end';
    }
    out += `<path class="lnk${tt === 'users' ? ' user' : ''}" data-a="${ft}" data-b="${tt}" d="${d}" marker-start="url(#many)" marker-end="url(#one)"/>`;
  }
  svg.innerHTML = out;
}

function focus(name) {
  board.classList.toggle('focus', !!name);
  canvas.querySelectorAll('.on').forEach((e) => e.classList.remove('on'));
  svg.querySelectorAll('.on').forEach((e) => e.classList.remove('on'));
  if (!name) return;
  els[name].classList.add('on');
  for (const l of L) if (l.from[0] === name || l.to === name) {
    for (const c of [].concat(l.from[1])) els[l.from[0]].querySelector(`[data-c="${c}"]`)?.classList.add('on');
    for (const c of l.toCols ?? ['id']) els[l.to].querySelector(`[data-c="${c}"]`)?.classList.add('on');
  }
  svg.querySelectorAll(`[data-a="${name}"],[data-b="${name}"]`).forEach((e) => {
    e.classList.add('on');
    els[e.dataset.a].classList.add('on');
    els[e.dataset.b].classList.add('on');
  });
}
for (const [n, el] of Object.entries(els)) {
  el.addEventListener('mouseenter', () => focus(n));
  el.addEventListener('mouseleave', () => focus(null));
}

document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
  const keys = b.dataset.mode === 'keys';
  document.body.classList.toggle('keys-only', keys);
  document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  layout();
}));
// В режиме «Только ключи» карточки короче — подтягиваем нижние, чтобы не было пустот
function layout() {
  const place = (n, x, y) => { els[n].style.left = x + 'px'; els[n].style.top = y + 'px'; };
  const bottom = (n) => els[n].offsetTop + els[n].offsetHeight;
  COLS.forEach((col, i) => col.forEach((n) => (els[n].style.left = COL_X[i] + 'px')));
  // колонки 1 и 3: друг под другом
  place('users', COL_X[0], TOP); place('search_requests', COL_X[0], bottom('users') + GAP);
  place('chats', COL_X[2], TOP); place('bookings', COL_X[2], bottom('chats') + GAP);
  // объявления опускаем ниже строк «арендатор», чтобы линии к пользователям шли над ними
  // и ниже строки id запросов «ищу», чтобы линия «отклик на запрос» не шла через карточку
  place('listings', COL_X[1], Math.max(rowY('bookings', 'renter_id') + 44, rowY('search_requests', 'id') + 48));
  place('messages', COL_X[3], TOP); place('payments', COL_X[3], Math.max(els.bookings.offsetTop, bottom('messages') + GAP));
  draw();
  fit();
}

// На узком экране схема целиком не помещается: уменьшаем её, чтобы связи были видны все сразу
let zoomMode = 'fit';
function fit() {
  canvas.style.transform = '';
  board.style.height = '';
  const avail = board.clientWidth, w = canvas.offsetWidth;
  const canFit = avail < w;
  board.classList.toggle('can-fit', canFit);
  const on = canFit && zoomMode === 'fit';
  board.classList.toggle('fit', on);
  if (on) {
    const k = avail / w;
    canvas.style.transform = `scale(${k})`;
    board.style.height = Math.ceil(canvas.offsetHeight * k) + 2 + 'px';
  }
}
document.querySelectorAll('[data-zoom]').forEach((b) => b.addEventListener('click', () => {
  zoomMode = b.dataset.zoom;
  document.querySelectorAll('[data-zoom]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  fit();
}));
addEventListener('resize', fit);

const root = document.documentElement;
const themeBtn = document.getElementById('theme');
const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const syncTheme = () => { themeBtn.textContent = dark() ? 'Светлая тема' : 'Тёмная тема'; };
themeBtn.addEventListener('click', () => { root.dataset.theme = dark() ? 'light' : 'dark'; syncTheme(); });
syncTheme();
document.fonts.ready.then(layout);
layout();
</script>
